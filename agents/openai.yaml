interface:
  display_name: "Seedance Shot Director"
  short_description: "工业级 Seedance 2.0/2.5 漫剧分镜"
  default_prompt: "Use $seedance-shot-director for Seedance 2.0/2.5 shot direction. When a complete script is supplied, register it without generating shots, check whether it exceeds 150000 Unicode characters and ask for confirmation if so, then collect three options: 15s or 30s block duration, visual style, and whether to output an asset list. After configuration, wait for the user to send the segment to process. Only then produce independent, paste-ready generation blocks with shot tasks, physicalized actions, dialogue-capacity checks, spatial continuity, and conditional combat previs."
policy:
  allow_implicit_invocation: true
